---
services:
  umami:
    image: ghcr.io/umami-software/umami:latest
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://umami:umami@db:5432/umami
      APP_SECRET: ${APP_SECRET}
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY}
      DISABLE_TELEMETRY: ${DISABLE_TELEMETRY}
    depends_on:
      db:
        condition: service_healthy
    init: true
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:3000/api/heartbeat"]
      interval: 5s
      timeout: 5s
      retries: 5
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
  db-backup:
    # Tag must track the db service's major version: pg_dump refuses to dump a
    # server newer than itself.
    image: prodrigestivill/postgres-backup-local:15
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami
      # 23:00 daily (go-cron, seconds first), an hour before the sync cron, so
      # the nightly dump is complete and closed before it is uploaded.
      SCHEDULE: '0 0 23 * * *'
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    volumes:
      # Bind mount, not a named volume, so the host can sync these off-droplet.
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: always
  caddy:
    image: caddy:latest
    environment:
      CADDY_EMAIL: ${CADDY_EMAIL}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./caddy/production/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    restart: always
    depends_on:
      - umami
volumes:
  umami-db-data:
  caddy_data:
  caddy_config:
